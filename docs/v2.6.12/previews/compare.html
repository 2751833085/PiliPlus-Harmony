<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.6.12 原生像素核对</title>
<style>body{margin:24px;background:#111214;color:#eee;font:15px/1.5 system-ui}h1{font-size:22px}p{max-width:1000px;color:#bbb}label{display:flex;align-items:center;gap:12px;margin:20px 0}main{display:flex;align-items:flex-start;gap:24px;width:max-content}figure{margin:0}figcaption{font-size:13px;min-height:70px}img{display:block;width:calc(var(--w)*var(--z)*1px);height:calc(2232*var(--z)*1px);border:1px solid #555}a{color:#ff85ac}:root{--z:.17}</style>
<h1>V2.6.12 · 菜单、快捷入口与视频界面</h1><p>按原生像素直接渲染，共用显示倍率。三屏 DPR 2.875 来自实测；单、双屏采用参考 DPR 2.875 展示，测试另扫描 2.5 / 3.25。字体来自本地设备，未分发。这里是组件测试画面，不能替代实机验收；“关于组件”图将快捷入口与关于头部/历程放在一起，实际应用分属不同页面。播放器菜单图使用无业务写入的测试回调。</p>
<label>倍率 <input type="range" min=".12" max="1" step=".01" value=".17" oninput="document.documentElement.style.setProperty('--z',this.value);document.querySelector('output').textContent=Math.round(this.value*100)+'%'"> <output>17%</output></label>
<label>界面 <select onchange="document.querySelectorAll('main img').forEach(i=>{i.src=this.value+'-'+i.dataset.form+'.png';i.parentNode.href=i.src})"><option value="menu">统一贴底菜单</option><option value="about">快捷入口与关于组件</option><option value="feed">短视频</option><option value="comments">评论</option><option value="paused">暂停</option></select></label>
