name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release_ohos:
    name: Release for ohos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          fi
          # sanitize slashes in tag/branch name for filename use
          tag="${tag//\//-}"
          echo "tag=${tag}" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: "26.0.0.821"
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup flutter-ohos
        run: |
          git clone --depth 1 -b 3.44.9+ohos-0.0.1-canary1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate env.json
        run: dart .vscode/build_env.dart "${{ env.tag }}"
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Harmony regression tests
        run: flutter test test/harmony_adapt
        shell: bash

      - name: Build Flutter for ohos
        run: flutter build hap --release --no-codesign --dart-define-from-file=.vscode/env.json
        shell: bash

      # Unsigned CI builds are diagnostics, not in-app updates. Never turn an
      # already-published signed release into a draft or add an unsigned HAP to it.
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Harmony-${{ env.tag }}-unsigned
          path: build/ohos/hap/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 14
