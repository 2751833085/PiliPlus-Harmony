name: pr_check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'static/**'
      - '**.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flutter-ohos
        run: |
          git clone --depth 1 -b 3.44.9+ohos-0.0.1-canary1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Dart Analyze
        run: dart analyze --no-fatal-warnings

      - name: Application regression tests
        run: flutter test
